name: oceanguardian_mvp
description: "OceanGuardian AI - MVP fisherman safety app (offline GPS, one-touch SOS, weather alerts, family tracking, market prices, government schemes)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Offline-first local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # GPS + connectivity
  geolocator: ^13.0.1
  connectivity_plus: ^6.0.5

  # Map (OpenStreetMap tiles, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  uuid: ^4.5.1
  intl: 0.20.2

  # Device telemetry (GPS trail context — Part 1/3 of the core build)
  battery_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  generate: true
